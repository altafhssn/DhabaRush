<!doctype html>
<html><head><meta charset="utf-8">
<title>Truck art: home, night</title>
<link href="https://fonts.googleapis.com/css2?family=Bakbak+One&display=block" rel="stylesheet">
<link href="truck.css" rel="stylesheet">
</head><body class="night">
<div class="world" style="background-image:url('file:///private/tmp/claude-501/-Users-almeer-Documents-HighwayDhaba/20a19725-cac8-42e1-ad48-3dfadc5d8164/scratchpad/uxd/bg/night/t004.0.png')"></div>

<!-- cash: a yellow commercial number plate (black on canary), rate on the indigo strip -->
<div class="cash">
  <div class="top"><span class="bolt"></span><span class="ic ic-note"></span><span class="amt num">24,400</span><span class="bolt"></span></div>
  <div class="rate"><span class="ic ic-rate"></span><span class="v num">1,034</span><span class="u">/min</span></div>
</div>

<!-- NEXT chip: a route board -->
<div class="next">
  <div class="disc"><span class="ic ic-kadai"></span></div>
  <div class="l1">NEXT: KADAI</div>
  <div class="l2">BUILD KADAI · <span class="num">10,000</span></div>
  <span class="chev"></span>
</div>

<!-- task strip: the tailgate band, CLAIM state -->
<div class="task">
  <div class="lab disp">TASK</div>
  <div class="card claim" style="left:42px;width:268px">
    <div class="cl"><span class="disp">CLAIM</span><span class="rw"><span class="ic ic-note"></span><span class="num">700</span></span></div>
    <div class="sep"></div>
    <div class="tx">Upgrade the chai counter<br>to level 25</div>
  </div>
  <div class="one num" style="left:314px">1/3</div>
  <div class="fr o-fringe"></div>
</div>

<!-- meter: the load board, one button -->
<div class="meter">
  <div class="row"><span class="ic ic-seats"></span><span class="lb">SEATS</span><span class="tr"><i style="width:26%"></i></span></div>
  <div class="row"><span class="ic ic-cooks"></span><span class="lb">COOKS</span><span class="tr"><i style="width:84%"></i></span></div>
  <div class="row"><span class="ic ic-waiters"></span><span class="lb">WAITERS</span><span class="tr"><i style="width:32%"></i></span></div>
  <div class="row lim"><span class="ic ic-cashiers"></span><span class="lb">CASHIERS</span><span class="tr"><i style="width:100%"></i></span><span class="chev ink"></span></div>
  <div class="cap">Road: <span class="num" style="font-weight:800">&nbsp;12</span>/min · all seated</div>
</div>

<!-- the menu plaque (as in the base shot) and the one world tag -->
<div class="plaque" style="left:145px;top:131px;width:164px">
  <div class="k">NEW ON THE MENU</div>
  <div class="row"><span class="ic ic-chai"></span><div class="nm"><div class="n">COFFEE</div><div class="h hi">कॉफ़ी</div></div><div class="pr num"><span class="ic ic-note"></span>44.60</div></div>
</div>
<div class="wtag" style="left:296px;top:286px"><span class="k">NEW:</span>Naan</div>

<!-- settings: chrome hubcap -->
<div class="gear" style="left:325.5px;top:522px"><div class="in"><span class="ic ic-settings"></span></div></div>

<!-- STAFF and BUILD: tailgate plates, mirrored (K3) -->
<div class="corner" style="left:7.5px;top:557px"><span class="ic ic-staff"></span><span class="fl o-phool_s" style="left:3px;top:3px"></span><span class="fl o-phool_s" style="right:3px;top:3px"></span></div>
<div class="capplate" style="left:9.5px;top:601px;width:46px">STAFF</div>
<div class="badge o-phool_jade" style="left:1.5px;top:551px">+</div>

<div class="corner" style="left:302.5px;top:557px"><span class="ic ic-build"></span><span class="fl o-phool_s" style="left:3px;top:3px"></span><span class="fl o-phool_s" style="right:3px;top:3px"></span></div>
<div class="capplate" style="left:304.5px;top:601px;width:46px">BUILD</div>
<div class="badge o-phool_red" style="left:296.5px;top:551px">!</div>
</body></html>
