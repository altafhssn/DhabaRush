<!doctype html>
<html><head><meta charset="utf-8">
<title>Truck art: welcome back</title>
<link href="https://fonts.googleapis.com/css2?family=Bakbak+One&display=block" rel="stylesheet">
<link href="truck.css" rel="stylesheet">
</head><body>
<div class="world" style="background-image:url('file:///private/tmp/claude-501/-Users-almeer-Documents-HighwayDhaba/20a19725-cac8-42e1-ad48-3dfadc5d8164/scratchpad/uxd/bg/mid/t004.0.png')"></div>

<!-- the HUD under the popup, as in the base shot -->
<div class="cash">
  <div class="top"><span class="bolt"></span><span class="ic ic-note"></span><span class="amt num">24,400</span><span class="bolt"></span></div>
  <div class="rate"><span class="ic ic-rate"></span><span class="v num">1,034</span><span class="u">/min</span></div>
</div>
<div class="task">
  <div class="lab disp">TASK</div>
  <div class="card claim" style="left:42px;width:268px">
    <div class="cl"><span class="disp">CLAIM</span><span class="rw"><span class="ic ic-note"></span><span class="num">700</span></span></div>
    <div class="sep"></div>
    <div class="tx">Upgrade the chai counter<br>to level 25</div>
  </div>
  <div class="one num" style="left:314px">1/3</div>
  <div class="fr o-fringe"></div>
</div>
<div class="meter">
  <div class="row"><span class="ic ic-seats"></span><span class="lb">SEATS</span><span class="tr"><i style="width:26%"></i></span></div>
  <div class="row"><span class="ic ic-cooks"></span><span class="lb">COOKS</span><span class="tr"><i style="width:84%"></i></span></div>
  <div class="row"><span class="ic ic-waiters"></span><span class="lb">WAITERS</span><span class="tr"><i style="width:32%"></i></span></div>
  <div class="row lim"><span class="ic ic-cashiers"></span><span class="lb">CASHIERS</span><span class="tr"><i style="width:100%"></i></span><span class="chev ink"></span></div>
  <div class="cap">Road: <span class="num" style="font-weight:800">&nbsp;12</span>/min · all seated</div>
</div>
<div class="gear" style="left:325.5px;top:522px"><div class="in"><span class="ic ic-settings"></span></div></div>
<div class="corner" style="left:7.5px;top:557px"><span class="ic ic-staff"></span></div>
<div class="capplate" style="left:9.5px;top:601px;width:46px">STAFF</div>
<div class="badge o-phool_jade" style="left:1.5px;top:551px">+</div>
<div class="corner" style="left:302.5px;top:557px"><span class="ic ic-build"></span></div>
<div class="capplate" style="left:304.5px;top:601px;width:46px">BUILD</div>
<div class="badge o-phool_red" style="left:296.5px;top:551px">!</div>

<div class="dim"></div>

<!-- WELCOME BACK: a crowned tailgate; the day's takings on a number plate -->
<div class="popup" style="left:30px;top:180px;width:300px;height:279px">
  <div class="crown o-crown"></div>
  <div class="ph">WELCOME BACK!</div>
  <div class="pb"></div>
</div>
<div class="roundel teal" style="left:44px;top:236px;width:44px;height:44px"><span class="ic ic-clock" style="width:30px;height:30px"></span></div>
<div class="abs" style="left:97px;top:235px;width:220px;font-size:var(--t26);font-weight:600;line-height:16px;color:var(--ink)">Your staff kept the dhaba open while you were away (up to 2 h).</div>
<div class="abs" style="left:30px;width:300px;top:286px;text-align:center;font-size:var(--t20);color:var(--muted);font-weight:600">You were away for <span class="num">2h 00m</span>.</div>
<div class="abs" style="left:0;width:360px;top:302px;display:flex;justify-content:center"><div class="bigplate"><span class="ic ic-note"></span><span class="v num">31,952</span></div></div>
<div class="btn primary" style="left:70px;top:355px;width:220px;height:41px"><span class="cap" style="font-size:var(--t34)">COLLECT</span></div>
<div class="btn secondary" style="left:80px;top:408px;width:200px;height:37px;flex-direction:row;gap:6px"><span class="ic ic-play" style="width:22px;height:22px"></span><span class="cap">COLLECT x2</span></div>
</body></html>
