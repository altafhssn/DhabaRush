[plugin]

name="Dhaba export guard"
description="Keeps Android exports to the ABIs that every native plugin library supports (GameAnalytics 3.1.2: arm64 only), so no build can crash at launch on a phone without that library. Also keeps R8 code shrinking on for release Gradle builds, derives every Android preset's version name / code from application/config/version, and checks release (Google Play) exports: docs/launch/release.md."
author="Little Tag Art Studios"
version="1.1"
script="plugin.gd"
