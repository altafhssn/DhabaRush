; Dhaba Rush monetisation config, read by
; res://scripts/v3/monetization/monetization_config.gd (Ads, Iap, Analytics).
;
; Everything committed in this file is a Google TEST id or an empty
; placeholder. Real ids and keys go in res://config/monetization.local.cfg
; (git-ignored; copy monetization.local.cfg.example). Any key set there
; overrides the same key here. docs/launch/sdk.md lists what the owner fills.
;
; Values use Godot ConfigFile syntax: strings in quotes, lists as
; PackedStringArray("a", "b"). Comments must sit on their own line.

[ads]

enabled=true
; Google's published sample ad units: they always fill with test ads and
; never earn money. Release builds need the owner's real units (local file).
android_rewarded="ca-app-pub-3940256099942544/5224354917"
android_interstitial="ca-app-pub-3940256099942544/1033173712"
ios_rewarded="ca-app-pub-3940256099942544/1712485313"
ios_interstitial="ca-app-pub-3940256099942544/4411468910"
; Debug builds always request the sample units above, even when the local
; file holds real ones (protects the AdMob account from invalid traffic).
force_test_units_in_debug=true
; AdMob test devices: the id the SDK prints in logcat / the Xcode console
; ("...setTestDeviceIds(Arrays.asList("33BE2250B43518CCDA7DE426D04EE231"))").
test_device_ids=PackedStringArray()
; UMP consent debugging, debug builds only: "" (off), "eea" or "not_eea".
consent_debug_geography=""
; UMP hashed device ids (logcat: "Use new ConsentDebugSettings.Builder()
; .addTestDeviceHashedId(...)").
consent_test_device_hashed_ids=PackedStringArray()
; Give up waiting for the UMP consent update after this many seconds and fall
; back to the consent stored from the last session (retried later).
consent_timeout_s=15.0
consent_retry_s=60.0
; Request configuration. Dhaba Rush is a general-audience (13+) game.
; max_ad_content_rating: "G", "PG", "T" or "MA".
max_ad_content_rating="T"
; -1 = unspecified, 0 = false, 1 = true.
tag_for_child_directed_treatment=-1
tag_for_under_age_of_consent=-1
; Preload retry with exponential backoff (base * 2^n, capped), plus timeouts
; so a silent SDK can never leave a button waiting forever.
load_retry_base_s=5.0
load_retry_max_s=300.0
load_timeout_s=60.0
init_timeout_s=20.0
show_open_timeout_s=15.0
show_close_timeout_s=300.0
; Loaded ads expire after an hour; drop and reload them a little before that.
ad_expiry_s=3300.0
; Interstitials (core and feel C7.1): OFF for the soft launch. The code
; default is also off, so a missing or broken key never turns them on.
interstitials_enabled=false
; Guardrails kept for a later decision (they apply only when enabled): none
; before session 4, at least 180 s apart, never during another ad, never for
; Remove Ads buyers, and never within 60 s of a rewarded video, a purchase
; (cash spent or a store purchase), any reward, or a launch / return to the
; game (interstitial_after_return_s, 60 s by default in ads.gd). The return
; screen (WELCOME BACK) never shows one: that is hard-coded in ads.gd
; (NEVER_TRIGGERS), so this file cannot switch it on.
interstitial_min_session=4
interstitial_min_interval_s=180.0
interstitial_after_rewarded_s=60.0
interstitial_after_purchase_s=60.0
interstitial_after_reward_s=60.0
; Which game moments may show one (the caps above still apply). The only
; call site wired in the game is "upgrade" (a counter sheet / STAFF panel
; closed back to the game after a purchase in it); the list is empty for the
; soft launch.
interstitial_triggers=PackedStringArray()
; Mute the game's master bus while a full-screen ad is open.
mute_audio_during_ads=true
; Debug builds only: use the built-in fake ads even when AdMob is present.
use_stub_ads=false

[iap]

; Debug builds only: fake store even on a phone (sideloaded APK testing; real
; Play Billing only works for builds installed from a Play testing track).
use_stub_store=false
; Watchdogs (foreground seconds) that release a stuck purchase / restore.
purchase_timeout_s=600.0
restore_timeout_s=30.0
connect_retry_base_s=5.0
connect_retry_max_s=300.0

; Store product id for each game product (left side = id used in the code,
; never change it). Defaults to the same id.
[iap_android]

vip_x2="vip_x2"
remove_ads="remove_ads"
sikke_small="sikke_small"
starter_pack="starter_pack"

[iap_ios]

vip_x2="vip_x2"
remove_ads="remove_ads"
sikke_small="sikke_small"
starter_pack="starter_pack"

[analytics]

enabled=true
; GameAnalytics keys for release builds (local file). Empty = nothing is sent.
game_key=""
secret_key=""
; A separate GameAnalytics game for debug builds keeps test data out of the
; real dashboards. Empty = debug builds send nothing (events still print).
debug_game_key=""
debug_secret_key=""
; Desktop runs never send unless this is true (GA drops ad events there).
send_from_desktop=false
; Random GameAnalytics user id instead of a device / advertising id.
use_randomized_id=true
; Attach the event's extra parameters as GameAnalytics custom fields.
custom_fields=true
; GameAnalytics SDK info log (debug builds only).
info_log=false
; Build string shown in GameAnalytics; empty = application/config/version.
build=""

[legal]

; Public privacy policy URL (Play listing, Data safety and AdMob need it).
privacy_policy_url=""
