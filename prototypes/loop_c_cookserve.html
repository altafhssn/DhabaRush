    var p = { id: ++S.cid, x: v.bayX + (Math.random() < 0.5 ? -1 : 1) * rand(12, 22), y: 146, path: [], state: 'walk', seat: null, sat: false,
      order: 'chai', patience: PATIENCE, bubPop: 0, bubShake: 0, pop: 0, alpha: 1, walkT: 0, hop: 0, mood: '', pay: 0, eatT: 0, gateT: 0,
      look: { shirt: pick(SHIRTS), skin: pick(SKINS), turban: tb ? pick(TURBANS) : null, cap: !tb && Math.random() < 0.25 ? pick(SHIRTS) : null, hair: Math.random() < 0.15 ? '#9a9a9a' : '#2b1a10' } };
    p.path.push({ x: GATE.x + rand(-6, 6), y: 150 }, { x: GATE.x, y: GATE.y });
    var seat = findSeat();

  function moveAlong(p, step) {

  function setLeave(p, mood) {

  function timeout(p) {

  function updateCustomers(dt) {

      if (p.state === 'walk' || p.state === 'leave') {
        p.walkT += dt;

        p.gateT -= dt;
        var seat = findSeat();

        else if (p.gateT <= 0) { S.lost++; addText(p.x, p.y - 26, 'No seat!', '#ff6b6b', 14); setLeave(p, 'sad'); }
      } else if (p.state === 'order') {
        p.bubPop += dt; p.patience -= dt;

      } else if (p.state === 'eat') {
        p.eatT -= dt;

      }

  }

  // vehicles
  function spawnVehicle() {
    var free = [], b, i;
    for (i = 0; i < 3; i++) if (!S.bayUsed[i]) free.push(i);
    if (!free.length) return false;
    b = S.vehN === 0 && free.indexOf(1) >= 0 ? 1 : pick(free);
    var late = S.time > 60, r = Math.random(), type, n;
    if (S.vehN === 0) { type = 'car'; n = 2; }
    else if (S.vehN === 1) { type = 'bike'; n = 1; }
    else if (r < (late ? 0.25 : 0.35)) { type = 'bike'; n = 1; }
    else if (r < (late ? 0.70 : 0.80)) { type = 'car'; n = Math.random() < 0.4 ? 1 : 2; }
    else { type = 'truck'; n = Math.random() < 0.5 ? 2 : 3; }
    S.vehN++; S.bayUsed[b] = true;
    S.vehicles.push({ type: type, bay: b, bayX: BAYS[b], x: -50, y: 80, ang: 0, phase: 'in', t: 0, dur: (BAYS[b] + 50) / 190 + 0.25,
      n: n, dropped: 0, dropT: 0.25, waitT: 0, col: pick(VCOL), col2: pick(VCOL), panels: [pick(PCOL), pick(PCOL), pick(PCOL), pick(PCOL)] });
    if (type === 'truck') sfx.horn();
    return true;
  }
  function nextInterval() {
    if (S.vehN === 1) return 2.6;
    var base = S.time < 60 ? 4.0 : lerp(4.0, 2.8, clamp((S.time - 60) / 60, 0, 1));
    return base + rand(-0.5, 0.5);
  }
  function updateVehicles(dt) {
    for (var i = S.vehicles.length - 1; i >= 0; i--) {
      var v = S.vehicles[i], f, e; v.t += dt;
      if (v.phase === 'in') { f = clamp(v.t / v.dur, 0, 1); v.x = lerp(-50, v.bayX, easeOutCubic(f)); if (f >= 1) { v.phase = 'turnIn'; v.t = 0; } }
      else if (v.phase === 'turnIn') { f = clamp(v.t / 0.55, 0, 1); e = easeInOut(f); v.y = lerp(80, 126, e); v.ang = lerp(0, Math.PI / 2, e); if (f >= 1) { v.phase = 'park'; v.t = 0; } }
      else if (v.phase === 'park') {
        if (v.dropped < v.n) { v.dropT -= dt; if (v.dropT <= 0) { spawnCustomer(v); v.dropped++; v.dropT = 0.35; } }
        else { v.waitT += dt; if (v.waitT > 3.5) { v.phase = 'turnOut'; v.t = 0; } }
      } else if (v.phase === 'turnOut') {
        f = clamp(v.t / 0.6, 0, 1); e = easeInOut(f); v.y = lerp(126, 80, e); v.ang = lerp(Math.PI / 2, 0, e);
        if (f >= 1) { v.phase = 'out'; v.t = 0; S.bayUsed[v.bay] = false; }
      } else { v.x += dt * (60 + v.t * 260); if (v.x > W + 70) S.vehicles.splice(i, 1); }
    }
  }
  function updateTraffic(dt) {
    S.trafficT -= dt;
    if (S.trafficT <= 0) {
      S.trafficT = rand(1.6, 3.8);
      var r = Math.random();
      S.traffic.push({ type: r < 0.3 ? 'bike' : r < 0.7 ? 'car' : 'truck', x: W + 60, y: 52, ang: Math.PI, sp: rand(130, 190),
        col: pick(VCOL), col2: pick(VCOL), panels: [pick(PCOL), pick(PCOL), pick(PCOL), pick(PCOL)] });
    }
    for (var i = S.traffic.length - 1; i >= 0; i--) { var v = S.traffic[i]; v.x -= v.sp * dt; if (v.x < -70) S.traffic.splice(i, 1); }
  }

  // stations
  function slotX(st, i) { return st.cx + (i ? 26 : -26); }
  function filled(st) { return (st.slots[0] ? 1 : 0) + (st.slots[1] ? 1 : 0); }
  function freeCap(st) { return 2 - filled(st) - (st.cooking ? 1 : 0) - st.queue; }
  function stationFor(type) { for (var i = 0; i < S.stations.length; i++) if (S.stations[i].item === type) return S.stations[i]; return null; }
  function startCook(st) { st.cooking = true; st.t = 0; }
  function tapStation(st) {
    if (freeCap(st) > 0) {
      if (!st.cooking) startCook(st); else st.queue++;
      st.squash = 1; sfx.tap(); vib(8);
      burst(st.cx, APP_Y - 14, 3, ['rgba(255,255,255,0.8)'], 'puff');
    } else {
      st.shake = 0.35; sfx.err(); flashHint('Counter full: serve those first!', 1.6);
    }
  }
  function updateStations(dt) {
    S.stations.forEach(function (st) {
      st.pop += dt;
      if (st.squash > 0) st.squash = Math.max(0, st.squash - dt * 5);
      if (st.shake > 0) st.shake = Math.max(0, st.shake - dt);
      if (st.ring > 0) st.ring = Math.max(0, st.ring - dt * 2.5);
      st.slots.forEach(function (it) { if (it) { it.pop += dt; if (it.bounce > 0) it.bounce = Math.max(0, it.bounce - dt * 4); } });
      if (st.locked) return;
      if (st.cooking) {
        st.t += dt;
        if (st.id === 'tandoor' && Math.random() < dt * 10) burst(st.cx + rand(-8, 8), APP_Y - 6, 1, ['#ffa94d', '#ffd43b'], 'ember');
        if (st.t >= COOK[st.item]) {
          var idx = st.slots[0] === null ? 0 : st.slots[1] === null ? 1 : -1;
          if (idx >= 0) {
            st.slots[idx] = { type: st.item, pop: 0, lifted: false, selected: false, bounce: 0 };
            st.cooking = false; st.ring = 1; sfx.done(); vib(6);
            burst(slotX(st, idx), SLOT_Y - 8, 7, ['#ffffff', '#ffe8a3'], 'spark');
          } else st.t = COOK[st.item];
        }
      }
      if (!st.cooking) {
        if (st.queue > 0) { st.queue--; startCook(st); }
        else if (S.hold && S.hold.st === st && freeCap(st) > 0) { startCook(st); st.squash = 1; sfx.tap(); }
        else if (S.chotu && st.id === 'chai' && freeCap(st) > 0) {
          st.autoT += dt;
          if (st.autoT >= CHOTU_CHAI_DELAY) { st.autoT = 0; startCook(st); st.squash = 0.7; if (dist(S.chotu.x, S.chotu.y, CHOTU_HOME.x, CHOTU_HOME.y) < 8) S.chotu.hop = 1; }
        } else st.autoT = 0;
      }
    });
  }

  // serving & combo
  function readySlot(type) {
    var st = stationFor(type); if (!st || st.locked) return null;
    for (var i = 0; i < 2; i++) if (st.slots[i] && !st.slots[i].lifted) return { st: st, i: i };
    return null;
  }
  function ordering() { return S.customers.filter(function (p) { return p.state === 'order'; }).sort(function (a, b) { return a.patience - b.patience; }); }
  function urgent(type) { var o = ordering(); for (var i = 0; i < o.length; i++) if (o[i].order === type) return o[i]; return null; }
  function custAt(x, y, rad) {
    var best = null, bd = rad;
    S.customers.forEach(function (p) {
      if (p.state !== 'order') return;
      var d = Math.min(dist(x, y, p.seat.bx, p.seat.by), dist(x, y, p.x, p.y - 6));
      if (d < bd) { bd = d; best = p; }
    });
    return best;
  }
  function dropTarget(x, y, type) {
    var best = null, bd = 36, wrong = null, wd = 36;
    S.customers.forEach(function (p) {
      if (p.state !== 'order') return;
      var d = Math.min(dist(x, y, p.seat.bx, p.seat.by), dist(x, y, p.x, p.y - 6));
      if (p.order === type) { if (d < bd) { bd = d; best = p; } } else if (d < wd) { wd = d; wrong = p; }
    });
    return { match: best, wrong: wrong };
  }
  function serve(p, st, i, x, y) {
    var it = st.slots[i]; if (!it) return;
    st.slots[i] = null;
    if (S.sel && S.sel.st === st && S.sel.i === i) S.sel = null;
    p.state = 'served';
    S.combo = (S.time - S.lastServe <= COMBO_WIN) ? S.combo + 1 : 1;
    S.lastServe = S.time; if (S.combo > S.best) S.best = S.combo;
    var fr = clamp(p.patience / PATIENCE, 0, 1);
    var tip = MAX_TIP * clamp((fr - 0.25) / 0.75, 0, 1);
    var cb = Math.min(COMBO_CAP, COMBO_STEP * (S.combo - 1));
    p.pay = Math.round(PRICE[p.order] * (1 + tip + cb));
    S.served++;
    S.flies.push({ kind: 'serve', type: p.order, x0: x, y0: y, x1: p.seat.fx, y1: p.seat.fy, t: 0, dur: 0.2, cust: p });
    sfx.serve(S.combo); vib(15);
    if (S.combo >= 2) { S.comboPop = 1; sfx.combo(S.combo); burst(180, 212, 8 + Math.min(S.combo, 8) * 2, CONF, 'spark'); }
    if (tip >= 0.2) addText(p.x, p.y - 30, 'Fast!', '#8ce99a', 14);
  }
  function wrong(p) { p.bubShake = 0.4; sfx.err(); vib(20); flashHint('They ordered ' + p.order + '!', 1.6); }
  function breakCombo() {

    S.combo = 0; S.lastServe = -99;
  }
  function updateFlies(dt) {
    for (var i = S.flies.length - 1; i >= 0; i--) {
      var f = S.flies[i]; f.t += dt;

      S.flies.splice(i, 1);

        f.cust.state = 'eat'; f.cust.eatT = EAT; f.cust.hop = 1; sfx.plate();

  }

    if (!S.sel) return;

    S.sel = null;
  }

  // cash
  function dropCash(seat, v) {
    for (var i = 0; i < S.cash.length; i++) if (S.cash[i].seat === seat) { S.cash[i].value += v; S.cash[i].age = 0; S.cash[i].pop = 0; sfx.cash(); return; }
    S.cash.push({ seat: seat, x: seat.cashX, y: seat.cashY, top: seat.row < 0, value: v, age: 0, pop: 0, claimed: false, dead: false });
    sfx.cash();
  }
  function collect(cs, frac, by) {
    var idx = S.cash.indexOf(cs); if (idx < 0) return;
    S.cash.splice(idx, 1); cs.dead = true;
    var v = Math.max(1, Math.round(cs.value * frac));
    S.wallet += v; S.earned += v;
    addText(cs.x, cs.y - 16, '+₹' + v, frac < 1 ? '#d0bfae' : '#ffd43b', frac < 1 ? 14 : 18);
    if (by === 'auto') addText(cs.x, cs.y + 6, 'half: too slow', '#ffc9a8', 10);
    flyCoins(cs.x, cs.y, clamp(Math.round(v / 7), 2, 7), v);

    sfx.coin(); if (by === 'tap') vib(10);
  }
  function updateCash(dt) {
    for (var i = S.cash.length - 1; i >= 0; i--) { var cs = S.cash[i]; cs.age += dt; cs.pop += dt; if (cs.age >= CASH_AUTO) collect(cs, 0.5, 'auto'); }
  }

  // buying
  function tryBuy(key) {
    var b = S.buys[key]; if (!b || b.bought) return;
    var d = b.def;
    if (S.wallet >= d.price) {
      S.wallet -= d.price; S.shown -= d.price; b.bought = true;
      S.shake = 7; vib(30); sfx.buy();
      burst(d.x, d.y, 34, CONF, 'confetti'); burst(d.x, d.y, 14, ['#ffffff', '#ffd43b'], 'spark');
      if (key === 'table2') { S.t2pop = 0; addText(d.x, d.y - 30, '4 more seats!', '#ffffff', 18); flashHint('Table 2 open: more customers, more cash!', 2.2); }
      else if (key === 'dal') { var st = S.stations[2]; st.locked = false; st.pop = 0; S.orderSeq.push('dal'); addText(d.x, d.y - 52, 'Dal pays ₹45!', '#ffffff', 17); flashHint('Dal unlocked: slow to cook, pays big', 2.2); }
      else { S.chotu = { x: d.x, y: d.y, target: null, pop: 0, walkT: 0, hop: 0, moving: false }; addText(d.x, d.y - 30, 'Chotu hired!', '#ffffff', 17); flashHint('Chotu brews chai and picks up cash', 2.4); }
    } else {
      b.shake = 0.45; b.red = 0.6; sfx.err(); vib(20);
      flashHint('Need ₹' + (d.price - S.wallet) + ' more for ' + d.label, 1.8);
    }
  }
  function updateChotu(dt) {
    var ch = S.chotu; if (!ch) return;
    ch.pop += dt; if (ch.hop > 0) ch.hop = Math.max(0, ch.hop - dt * 3);
    if (ch.target && ch.target.dead) ch.target = null;
    if (!ch.target) {
      var best = null, bd = 1e9;
      S.cash.forEach(function (cs) { if (!cs.claimed && cs.age > CHOTU_DELAY) { var d = dist(ch.x, ch.y, cs.x, cs.y); if (d < bd) { bd = d; best = cs; } } });
      if (best) { best.claimed = true; ch.target = best; }
    }
    var tx = ch.target ? ch.target.x : CHOTU_HOME.x, ty = ch.target ? ch.target.y + 12 : CHOTU_HOME.y;
    var dd = dist(tx, ty, ch.x, ch.y), step = CHOTU_SPEED * dt;
    ch.moving = dd > 1;
    if (ch.moving) { ch.walkT += dt; if (dd <= step) { ch.x = tx; ch.y = ty; } else { ch.x += (tx - ch.x) / dd * step; ch.y += (ty - ch.y) / dd * step; } }
    if (ch.target && dd <= step + 2) { collect(ch.target, 1, 'chotu'); ch.target = null; ch.hop = 1; }
  }

  // fx
  function burst(x, y, n, cols, kind) {
    for (var i = 0; i < n && S.parts.length < 420; i++) {
      var a = Math.random() * TAU, conf = kind === 'confetti', sp = conf ? rand(80, 230) : kind === 'puff' ? rand(10, 30) : rand(40, 150);
      var vy = Math.sin(a) * sp - (conf ? 130 : 20);
      if (kind === 'ember' || kind === 'heart') vy = -rand(40, 80);
      S.parts.push({ x: x, y: y, vx: Math.cos(a) * sp * (kind === 'ember' || kind === 'heart' ? 0.2 : 1), vy: vy, life: 0,
        max: conf ? rand(0.8, 1.3) : kind === 'heart' ? 0.9 : rand(0.35, 0.7), c: cols[i % cols.length], s: conf ? rand(3, 6) : rand(2, 4), kind: kind, rot: Math.random() * 6, vr: rand(-10, 10) });
    }
  }
  function addText(x, y, s, col, size) { S.texts.push({ x: x, y: y, s: s, col: col, size: size, life: 0, max: 1.1 }); if (S.texts.length > 30) S.texts.shift(); }
  function flashHint(text, t) { S.flash = { text: text, t: t || 2 }; }
  function flyCoins(x, y, n, value) {
    var base = Math.floor(value / n), rem = value - base * n;
    for (var i = 0; i < n; i++) S.coins.push({ x0: x + rand(-6, 6), y0: y + rand(-4, 4), cx: x + rand(-50, 50), cy: y - rand(60, 130), t: -i * 0.05, dur: rand(0.45, 0.6), v: base + (i < rem ? 1 : 0) });
  }
  function updateFx(dt) {
    var i;
    for (i = S.parts.length - 1; i >= 0; i--) {
      var p = S.parts[i]; p.life += dt;
      if (p.life >= p.max) { S.parts.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      if (p.kind === 'confetti') { p.vy += 420 * dt; p.vx *= 0.985; }

    for (i = S.coins.length - 1; i >= 0; i--) {
      var c = S.coins[i]; c.t += dt;
      if (c.t >= c.dur) { S.coins.splice(i, 1); S.shown += c.v; S.walletBump = 1; sfx.clink(); burst(WALLET.x, WALLET.y, 2, GOLD, 'spark'); }
    }
  }

  // guide
  function supply(type) {
    var st = stationFor(type); if (!st) return 0;
    return filled(st) + (st.cooking ? 1 : 0) + st.queue;
  }
  function computeGuide() {
    var type = null, i, o;
    if (S.drag) type = S.drag.type; else if (S.sel) { var it = S.sel.st.slots[S.sel.i]; type = it ? it.type : null; }
    if (type) {
      var u = urgent(type);
      if (u) return { x: u.seat.bx, y: u.seat.by - 24, text: (S.drag ? 'Drop it on the ' : 'Now tap the ') + type + ' order!' };
      return { text: 'Nobody wants ' + type + ' right now' };
    }
    var old = null;
    if (!S.chotu) S.cash.forEach(function (cs) { if (!old || cs.age > old.age) old = cs; }); // with Chotu hired he fetches it at full value
    if (old) return { x: old.x, y: old.y - 10, text: 'Tap the cash! Left alone it halves' };
    o = ordering();
    for (i = 0; i < o.length; i++) { var sl = readySlot(o[i].order); if (sl) return { x: slotX(sl.st, sl.i), y: SLOT_Y - 18, text: 'Drag the ' + o[i].order + ' onto the customer' }; }
    for (i = 0; i < o.length; i++) {
      var st = stationFor(o[i].order), dem = 0;
      o.forEach(function (q) { if (q.order === o[i].order) dem++; });
      if (st && !st.locked && supply(o[i].order) < dem && freeCap(st) > 0) return { x: st.cx, y: ST_Y - 10, text: 'Tap ' + st.def.name + ' to ' + VERB[o[i].order] };

    c.fillStyle = 'rgba(45,20,8,0.55)'; c.fillRect(-10, -10, W + 20, H + 20);
    panel(c, 24, 112, 312, 380);
    txt(c, 'Dhaba Rush', 180, 152, 38, '#ff922b', '#5c2a0c', 800);
    txt(c, 'Highway Idle Tycoon', 180, 182, 13, '#8a5a2b', null, 600);
    c.fillStyle = '#c92a2a'; rr(c, 100, 197, 160, 22, 11); c.fill(); txt(c, 'LOOP C · COOK & SERVE', 180, 207.5, 11, '#fff', null, 800);
    var rows = [['Tap a station to cook', 'hold it to keep cooking'], ['Drag food onto the order', 'or tap food, then the customer'], ['Tap the cash fast', 'serve back-to-back for COMBO tips']];
    rows.forEach(function (r, i) {
      var y = 250 + i * 46;
      circ(c, 62, y, 18, i === 0 ? '#25ad9f' : i === 1 ? '#fff' : '#2b8a3e');
      if (i === 0) { c.strokeStyle = '#fff'; c.lineWidth = 3.5; c.lineCap = 'round'; c.beginPath(); c.arc(62, y, 11, -Math.PI / 2, Math.PI * 0.9); c.stroke(); c.lineCap = 'butt'; }
      else if (i === 1) drawItem(c, 'chai', 62, y, 0.9); else drawCoin(c, 62, y, 9);
      txt(c, r[0], 92, y - 8, 15, '#3b1a08', null, 800, 'left'); txt(c, r[1], 92, y + 10, 12, '#8a5a2b', null, 600, 'left');
    });
    txt(c, 'Earn ₹400 in 2:00  ·  3 stars at ₹600', 180, 388, 13, '#5c2a0c', null, 800);
    button(c, 'Start shift', 410);
  }
  function drawEnd(c) {
    var t = S.endT, n = 0; STARS.forEach(function (v) { if (S.earned >= v) n++; });
    c.fillStyle = 'rgba(45,20,8,' + Math.min(0.6, t * 1.5) + ')'; c.fillRect(-10, -10, W + 20, H + 20);
    var s = popS(t, 0.4);
    c.save(); c.translate(180, 310); c.scale(s, s); c.translate(-180, -310);
    panel(c, 28, 132, 304, 372);
    txt(c, 'Shift over!', 180, 170, 32, '#ff922b', '#5c2a0c', 800);
    for (var i = 0; i < 3; i++) {
      var x = 120 + i * 60, y = i === 1 ? 222 : 232, r = i === 1 ? 26 : 21;
      starPath(c, x, y, r); c.fillStyle = '#e9d8c0'; c.fill(); c.strokeStyle = '#c9a982'; c.lineWidth = 2; c.stroke();
      var k = clamp((t - 0.55 - i * 0.35) / 0.35, 0, 1);
      if (S.earned >= STARS[i] && k > 0) { var e = Math.max(0.05, easeOutBack(k)); starPath(c, x, y, r * e); c.fillStyle = '#ffd43b'; c.fill(); c.strokeStyle = '#e8a10c'; c.lineWidth = 2.5; c.stroke(); }
    }
    txt(c, '₹' + S.earned, 180, 286, 36, '#2b8a3e', '#ffffff', 800);
    txt(c, 'earned this shift', 180, 312, 12, '#8a5a2b', null, 600);
    txt(c, 'Served ' + S.served + '   ·   Missed ' + S.lost, 180, 342, 15, '#3b1a08', null, 800);
    txt(c, S.best >= 2 ? 'Best combo x' + S.best : 'No combos yet: chain serves within 3s', 180, 366, S.best >= 2 ? 15 : 12, S.best >= 2 ? '#c2255c' : '#8a5a2b', null, 800);
    txt(c, ['Kal phir aana!', 'Not bad, keep going!', 'Badhiya! Goal reached', 'Ek number! Dhaba king'][n], 180, 394, 15, '#e8590c', null, 800);
    if (t > 0.9) { c.globalAlpha = clamp((t - 0.9) * 4, 0, 1); button(c, 'Play again', 414); c.globalAlpha = 1; }
    c.restore();
  }
  function draw() {
    var c = ctx, i;
    c.setTransform(1, 0, 0, 1, 0, 0); c.fillStyle = '#f3b664'; c.fillRect(0, 0, cv.width, cv.height);
    var sx = S.shake > 0.2 ? (Math.random() * 2 - 1) * S.shake : 0, sy = S.shake > 0.2 ? (Math.random() * 2 - 1) * S.shake : 0;
    c.setTransform(K, 0, 0, K, sx * K, sy * K);
    c.drawImage(bg, 0, 0, W, H);
    for (i = 0; i < S.traffic.length; i++) drawVehicle(c, S.traffic[i]);
    for (i = 0; i < S.vehicles.length; i++) drawVehicle(c, S.vehicles[i]);
    drawLights(c); drawTable2(c); drawTableItems(c);
    var list = S.customers.slice().sort(function (a, b) { return a.y - b.y; });
    for (i = 0; i < list.length; i++) drawCustomer(c, list[i]);
    for (i = 0; i < S.stations.length; i++) drawStation(c, S.stations[i]);
    if (S.chotu) drawChotu(c, S.chotu);
    drawBubbles(c);
    BUY_ORDER.forEach(function (k) { if (!S.buys[k].bought) drawTag(c, S.buys[k]); });
    drawFx(c); drawHUD(c); drawCombo(c);
    if (S.phase === 'play') { var g = computeGuide(); if (g.x !== undefined && S.time < GUIDE_T) drawArrow(c, g.x, g.y); drawHint(c, g); }
    else if (S.phase === 'start') drawStart(c);
    else drawEnd(c);
  }

  // ---------------- main loop ----------------
  var lastTs = 0;
  function frame(ts) {
    requestAnimationFrame(frame);
    if (S.paused) { lastTs = 0; return; }
    var dt = lastTs ? (ts - lastTs) / 1000 : 1 / 60; lastTs = ts;
    dt = clamp(dt, 0, 0.05);
    update(dt); draw();
  }
  resize();
  if (document.fonts && document.fonts.load) {
    Promise.all([document.fonts.load('800 16px "Baloo 2"'), document.fonts.load('600 16px "Baloo 2"')]).then(buildBg, function () { /* fallback font */ });
  }
  requestAnimationFrame(frame);
})();
</script>
