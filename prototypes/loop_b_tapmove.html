<style>

    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }

</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
(function () {
  'use strict';
  var W = 360, H = 640, SP = 6.5, TAU = Math.PI * 2;
  var FONT = '"Baloo 2", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  var cv = document.getElementById('c'), ctx = cv.getContext('2d');
  var bgc = document.createElement('canvas'), bgx = bgc.getContext('2d');
  var T = 0, last = 0, paused = false, S = null;

  // ---------------- tuning ----------------
  var CFG = {
    shift: 120, goal: 400, stars: [200, 400, 600],
    speed: 170, cap: 8, chotuSpeed: 95, chotuCap: 2, chotuPause: 0.3, pileCap: 6,
    patience: 16, gateWait: 6, eat: 2, custSpeed: 100,
    firstSpawn: 0.3, spawnMin: 3.5, spawnMax: 4.5, queueMax: 3,
    passR: 32, cashR: 26, mateServe: true, comboWin: 3.2, tipMax: 0.3, payTime: 1.0,
    guideTime: 22, idleNudge: 5
  };
  var ITEM = {
    chai: { price: 10, every: 1.0, label: 'CHAI', word: 'chai' },
    roti: { price: 25, every: 1.6, label: 'TANDOOR', word: 'roti' },
    dal: { price: 45, every: 2.4, label: 'DAL', word: 'dal' }
  };
  var ST_COL = { chai: ['#3cbfae', '#1f8378'], roti: ['#e58f50', '#b5602b'], dal: ['#efc94c', '#b8922a'] };
  var SHIRTS = ['#e63946', '#2a9d8f', '#457b9d', '#f4a261', '#8e5bd0', '#2b2d42', '#e9c46a', '#06a77d', '#ff6f91'];
  var SKINS = ['#8d5524', '#a8693c', '#c68642', '#7a4a26', '#b5774a'];
  var TURBANS = ['#ff7f11', '#d00000', '#ffba08', '#3a86ff', '#f15bb5'];
  var HAIRS = ['#1d1208', '#2e1d10', '#3b2a1a', '#4a4a4a'];
  var CAR_COLS = ['#e63946', '#1d70b8', '#f1f1ea', '#2a9d8f', '#ffb703', '#6d597a', '#9aa5b1'];
  var CAB_COLS = ['#ff8c1a', '#e63946', '#1d9e75', '#ffd23f', '#3a86ff'];
  var PANEL_COLS = ['#e63946', '#ffd23f', '#1d70b8', '#06d6a0', '#ff7f11', '#8e44ad', '#f15bb5'];
  var LANE = { '1': 54, '-1': 78 }, BAY_Y = 130;
  var WAIT_SPOTS = [{ x: 150, y: 204 }, { x: 210, y: 204 }, { x: 122, y: 214 }, { x: 238, y: 214 }, { x: 96, y: 224 }, { x: 264, y: 224 }, { x: 180, y: 226 }];

  // ---------------- utils ----------------
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function dist(ax, ay, bx, by) { var dx = ax - bx, dy = ay - by; return Math.sqrt(dx * dx + dy * dy); }
  function backOut(t) { t = clamp(t, 0, 1) - 1; return 1 + 2.70158 * t * t * t + 1.70158 * t * t; }
  function inOut(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }
  function popS(born, d) { return backOut((T - born) / (d || 0.35)); }
  function seeded(s) { return function () { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }
  function fmt(t) { t = Math.max(0, Math.ceil(t)); return Math.floor(t / 60) + ':' + ('0' + (t % 60)).slice(-2); }
  function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* not supported */ } }

  // ---------------- draw primitives ----------------
  function rr(c, x, y, w, h, r) {
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }
  function frr(c, x, y, w, h, r, col) { rr(c, x, y, w, h, r); c.fillStyle = col; c.fill(); }
  function circ(c, x, y, r, col) { c.beginPath(); c.arc(x, y, Math.max(0, r), 0, TAU); c.fillStyle = col; c.fill(); }
  function ell(c, x, y, rx, ry, col) { c.beginPath(); c.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), 0, 0, TAU); c.fillStyle = col; c.fill(); }
  function label(c, s, x, y, size, col, o) {
    o = o || {};
    var w = o.w || 800;
    c.font = w + ' ' + size + 'px ' + FONT; c.textAlign = o.a || 'center'; c.textBaseline = 'middle';
    if (o.max) { var mw = c.measureText(s).width; if (mw > o.max) c.font = w + ' ' + (size * o.max / mw) + 'px ' + FONT; }
    if (o.sw) { c.lineJoin = 'round'; c.lineWidth = o.sw; c.strokeStyle = o.sc || 'rgba(70,30,0,.9)'; c.strokeText(s, x, y); }
    c.fillStyle = col; c.fillText(s, x, y);
  }
  function coin(c, x, y, r) { circ(c, x, y + 1.2, r, '#c77d00'); circ(c, x, y, r, '#ffc531'); circ(c, x, y, r * 0.72, '#ffd85e'); label(c, '₹', x, y + 0.5, r * 1.15, '#b86b00'); }
  function star(c, x, y, r, fill, stroke) {
    c.beginPath();
    for (var i = 0; i < 10; i++) { var a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * 0.48 : r; c.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); }
    c.closePath(); c.fillStyle = fill; c.fill();
    if (stroke) { c.lineWidth = Math.max(1.4, r * 0.14); c.strokeStyle = stroke; c.lineJoin = 'round'; c.stroke(); }
  }
  function drawItem(c, type, x, y, s) {
    c.save(); c.translate(x, y); c.scale(s, s);
    if (type === 'chai') {
      c.beginPath(); c.moveTo(-6, -5); c.lineTo(6, -5); c.lineTo(4.5, 6); c.lineTo(-4.5, 6); c.closePath(); c.fillStyle = '#b4532a'; c.fill();
      c.fillStyle = 'rgba(255,255,255,.2)'; c.fillRect(-4.2, -3, 1.8, 7);
      ell(c, 0, -5, 6, 2.2, '#8a3a1a'); ell(c, 0, -5, 4.8, 1.5, '#e8c48f');
    } else if (type === 'roti') {
      ell(c, 0, 1, 9, 6, '#c98f45'); ell(c, 0, 0, 8.5, 5.5, '#ecc27a');
      circ(c, -3, -1, 1.3, '#a8662a'); circ(c, 2.5, 1.5, 1.1, '#a8662a'); circ(c, 3, -2, 0.9, '#b8763a'); circ(c, -1, 2.5, 0.8, '#b8763a');
    } else {
      c.beginPath(); c.ellipse(0, 0, 8.5, 7, 0, 0, Math.PI); c.fillStyle = '#8f99a4'; c.fill();
      ell(c, 0, 0, 8.5, 3.2, '#d3dae0'); ell(c, 0, 0, 7, 2.4, '#f2b630'); circ(c, -2, -0.4, 1, '#d1495b'); circ(c, 2, 0.2, 0.9, '#3a9d23');
    }
    c.restore();
  }

  // ---------------- audio ----------------
  var AC = null, master = null, lastSnd = {};
  function quiet(p) { if (p && p.catch) p.catch(function () { /* resume can be refused outside a gesture */ }); }
  function initAudio() {
    if (!AC) {
      try {
        var A = window.AudioContext || window.webkitAudioContext; if (!A) return;
        AC = new A(); master = AC.createGain(); master.gain.value = 0.7; master.connect(AC.destination);
      } catch (e) { AC = null; master = null; return; }
    }
    // 'suspended' (created before a gesture) or iOS 'interrupted' (call, background): resume inside this gesture
    if (AC.state !== 'running' && !paused) {
      try {
        quiet(AC.resume());
        var b = AC.createBufferSource(); b.buffer = AC.createBuffer(1, 1, 22050); b.connect(AC.destination); b.start(0); // iOS unlock
      } catch (e) { /* audio is optional */ }
    }
  }
  function tone(f, d, type, vol, f2, delay) {
    if (!AC || !master) return;
    try {
      var t0 = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
      o.type = type || 'sine'; o.frequency.setValueAtTime(f, t0);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + d);
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol || 0.08, t0 + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
      o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + d + 0.03);
    } catch (e) { /* audio is optional */ }
  }
  function sfx(n) {
    if (!AC) return;
    if (lastSnd[n] !== undefined && T - lastSnd[n] < 0.04) return;
    lastSnd[n] = T;
    switch (n) {
      case 'tap': tone(700, 0.05, 'sine', 0.05, 950); break;
      case 'grab': tone(rnd(520, 640), 0.07, 'triangle', 0.07, 1150); break;
      case 'order': tone(990, 0.06, 'sine', 0.035, 1320); break;
      case 'serve': tone(523, 0.09, 'triangle', 0.11, 784); tone(1046, 0.12, 'triangle', 0.08, 0, 0.07); break;
      case 'cash': tone(1568, 0.05, 'square', 0.022); tone(2093, 0.09, 'square', 0.022, 0, 0.05); break;
      case 'coin': tone(1318, 0.05, 'square', 0.03); tone(1760, 0.08, 'square', 0.03, 0, 0.04); break;
      case 'cook': tone(880, 0.07, 'sine', 0.03, 1100); break;
      case 'bill': tone(rnd(900, 1100), 0.03, 'triangle', 0.03); break;
      case 'buy': [523, 659, 784, 1046].forEach(function (f, i) { tone(f, 0.18, 'triangle', 0.1, 0, i * 0.07); }); break;
      case 'ready': tone(784, 0.1, 'sine', 0.06); tone(1175, 0.14, 'sine', 0.06, 0, 0.09); break;
      case 'angry': tone(260, 0.3, 'sawtooth', 0.06, 110); break;
      case 'err': tone(200, 0.12, 'square', 0.045, 150); break;
      case 'tick': tone(1250, 0.04, 'sine', 0.06); break;
      case 'combo': tone(660, 0.08, 'square', 0.035, 1320); break;
      case 'start': [392, 523, 659, 784].forEach(function (f, i) { tone(f, 0.16, 'triangle', 0.09, 0, i * 0.06); }); break;
      case 'end': [784, 659, 523, 659, 1046].forEach(function (f, i) { tone(f, 0.2, 'triangle', 0.09, 0, i * 0.1); }); break;
      case 'star': tone(880, 0.25, 'triangle', 0.1, 1760); break;
    }
  }

  // ---------------- state ----------------
  function newState() {
    var s = {
      mode: 'start', timeLeft: CFG.shift, wallet: 0, shown: 0, earned: 0, served: 0, lost: 0,
      combo: 0, bestCombo: 0, lastServe: -99, spawnT: CFG.firstSpawn, trafficT: 0.3, nVeh: 0, nCust: 0, orderN: 0,
      customers: [], vehicles: [], parts: [], texts: [], flyers: [], ripples: [], queue: [],
      shake: 0, walletPop: -9, msg: '', msgT: 0, hint: '', hintT: 0, na: null, guide: null,
      idleT: 0, playT: 0, guideForce: 0, forcePad: null,
      endT: 0, stars: 0, leftCash: 0, starShown: [false, false, false], btn: null, lastTick: 99, tips: {}, bornT: T,
      bays: [{ x: 64, v: null }, { x: 180, v: null }, { x: 296, v: null }], chotu: null
    };
    s.stations = ['chai', 'roti', 'dal'].map(function (id, i) {
      var x = [65, 180, 295][i];
      return { id: id, x: x, px: x, py: 503, count: [2, 1, 0][i], t: 0, locked: i === 2, pop: -9, born: -9 };
    });
    s.tables = [{ i: 0, cx: 95, cy: 318, locked: false, cash: 0, bounce: -9, born: -9 },
                { i: 1, cx: 265, cy: 318, locked: true, cash: 0, bounce: -9, born: -9 }];
    s.seats = [];
    s.tables.forEach(function (tb) {
      [-1, 1].forEach(function (side) { [-1, 1].forEach(function (v) { s.seats.push({ t: tb, side: side, x: tb.cx + side * 41, y: tb.cy + v * 17, occ: null }); }); });
    });
    s.pads = [
      { id: 'table2', label: 'Table 2', price: 60, x: 265, y: 318, w: 80, h: 50, paid: 0, done: false },
      { id: 'dal', label: 'Dal Pot', price: 120, x: 295, y: 488, w: 72, h: 40, paid: 0, done: false },
      { id: 'chotu', label: 'Hire Chotu', price: 200, x: 316, y: 424, w: 70, h: 50, paid: 0, done: false }
    ];
    s.bh = { x: 180, y: 462, stack: [], act: null, walk: 0, moving: false, squash: 0, park: null };
    return s;
  }
  function stationOf(type) { for (var i = 0; i < S.stations.length; i++) if (S.stations[i].id === type) return S.stations[i]; return S.stations[0]; }
  function padById(id) { for (var i = 0; i < S.pads.length; i++) if (S.pads[i].id === id) return S.pads[i]; return null; }
  function hasItem(e, type) { for (var i = 0; i < e.stack.length; i++) if (e.stack[i].type === type) return true; return false; }
  function mateOf(s) { for (var i = 0; i < S.seats.length; i++) { var o = S.seats[i]; if (o !== s && o.t === s.t && o.side === s.side) return o; } return null; }
  function setMsg(t, d) { S.msg = t; S.msgT = d || 3; }
  function pileX(st, i) { return st.x - 26 + (i % 3) * 26; }
  function pileY(st, i) { return i < 3 ? 534 : 522; }

  // ---------------- fx ----------------
  function floatText(x, y, s, col, size) { S.texts.push({ x: x, y: y, s: s, col: col, size: size || 14, born: T, max: 1.1 }); if (S.texts.length > 40) S.texts.shift(); }
  function part(p) { S.parts.push(p); }
  function burst(x, y, n, cols, conf) {
    for (var i = 0; i < n; i++) {
      var a = rnd(0, TAU), v = rnd(60, 190);
      part({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, g: 360, life: rnd(0.45, 0.85), max: 0.85, col: pick(cols), sz: rnd(2, 3.8), kind: conf ? 'conf' : 'spark', rot: rnd(0, 6) });
    }
  }
  function dust(x, y) { part({ x: x + rnd(-5, 5), y: y, vx: rnd(-15, 15), vy: rnd(-22, -6), g: 0, life: 0.35, max: 0.35, col: 'rgba(150,90,40,.35)', sz: rnd(2.5, 4.5), kind: 'dust' }); }
  function steam(x, y, col) { part({ x: x + rnd(-4, 4), y: y, vx: rnd(-6, 6), vy: rnd(-26, -16), g: 0, life: 1.1, max: 1.1, col: col || 'rgba(255,255,255,.45)', sz: rnd(2.5, 4), kind: 'steam' }); }
  function addFlyer(f) { f.t = -(f.delay || 0); S.flyers.push(f); }
  function ripple(x, y, col) { S.ripples.push({ x: x, y: y, born: T, col: col || '#fff' }); }

  // ---------------- vehicles ----------------
  function makeVeh(type, dir) {
    var L = type === 'bike' ? 24 : type === 'car' ? 44 : 78, Wd = type === 'bike' ? 10 : type === 'car' ? 22 : 26, p = [];
    for (var i = 0; i < 4; i++) p.push(pick(PANEL_COLS));
    return { type: type, dir: dir, len: L, wid: Wd, x: dir > 0 ? -L : W + L, y: LANE[dir], laneY: LANE[dir], col: type === 'truck' ? pick(CAB_COLS) : pick(CAR_COLS),
      rider: pick(SHIRTS), panels: p, sp: rnd(150, 210), st: 'pass', t: 0, dead: false, bay: null, party: 0, unl: 0 };
  }
  function spawnVehicle() {
    S.spawnT = rnd(CFG.spawnMin, CFG.spawnMax);
    var free = S.bays.filter(function (b) { return !b.v; });
    if (!free.length) { S.spawnT = 0.8; return; }
    var first = S.nVeh === 0, r = Math.random();
    var n = first ? 2 : r < 0.33 ? 1 : r < 0.75 ? 2 : 3;
    var bay = first && !S.bays[1].v ? S.bays[1] : pick(free);
    var type = n === 1 ? (Math.random() < 0.55 ? 'bike' : 'car') : n === 2 ? (Math.random() < 0.7 ? 'car' : 'truck') : (Math.random() < 0.65 ? 'truck' : 'car');
    var v = makeVeh(type, first ? 1 : (Math.random() < 0.5 ? 1 : -1));
    v.st = 'in'; v.bay = bay; bay.v = v; v.party = n; v.sp = 230;
    S.vehicles.push(v); S.nVeh++;
  }
  function updVehicles(dt) {
    S.trafficT -= dt;
    if (S.trafficT <= 0) { S.trafficT = rnd(1.4, 3.2); var r = Math.random(); S.vehicles.push(makeVeh(r < 0.2 ? 'bike' : r < 0.6 ? 'car' : 'truck', Math.random() < 0.5 ? 1 : -1)); }
    for (var i = 0; i < S.vehicles.length; i++) {
      var v = S.vehicles[i]; v.t += dt;
      if (v.st === 'pass' || v.st === 'out') {
        if (v.st === 'out') v.sp = Math.min(220, v.sp + 260 * dt);
        v.x += v.dir * v.sp * dt;
        if (v.x < -130 || v.x > W + 130) v.dead = true;
      } else if (v.st === 'in') {
        var dx = v.bay.x - v.x, ad = Math.abs(dx), sp = Math.min(v.sp, 40 + ad * 2.6);
        if (ad < 1.5) { v.x = v.bay.x; v.st = 'dock'; v.t = 0; } else v.x += (dx > 0 ? 1 : -1) * Math.min(ad, sp * dt);
      } else if (v.st === 'dock') {
        v.y = lerp(v.laneY, BAY_Y, inOut(v.t / 0.45)); if (v.t >= 0.45) { v.st = 'unload'; v.t = 0; }
      } else if (v.st === 'unload') {
        if (S.mode !== 'play') v.unl = v.party;
        if (v.unl < v.party && v.t > 0.1 + v.unl * 0.3) { newCustomer(v.x + (v.unl - (v.party - 1) / 2) * 14, BAY_Y + v.wid / 2 + 6); v.unl++; }
        if (v.unl >= v.party && v.t > v.party * 0.3 + 0.9) { v.st = 'undock'; v.t = 0; }
      } else if (v.st === 'undock') {
        v.y = lerp(BAY_Y, v.laneY, inOut(v.t / 0.45)); if (v.t >= 0.45) { v.st = 'out'; v.sp = 30; v.bay.v = null; }
      }
    }
    S.vehicles = S.vehicles.filter(function (v) { return !v.dead; });
  }

  // ---------------- customers ----------------
  function newCustomer(x, y) {
    S.customers.push({ id: ++S.nCust, x: x, y: y, st: 'walkin', path: [{ x: 180 + rnd(-8, 8), y: 150 }, { x: 180 + rnd(-6, 6), y: 166 }, { x: 180 + rnd(-10, 10), y: 194 }],
      seat: null, order: null, pat: 0, patMax: CFG.patience, wait: 0, eat: 0, born: T, sat: 0, shirt: pick(SHIRTS), skin: pick(SKINS),
      turban: Math.random() < 0.4 ? pick(TURBANS) : null, hair: pick(HAIRS), walk: rnd(0, 6), alpha: 1, angry: false,
      speed: CFG.custSpeed * rnd(0.92, 1.08), moving: false, spot: -1, bx: 0, by: 0, up: true, pay: 0, servedAt: 0, shakeT: -9, dead: false });
  }
  function pickOrder() {
    var n = S.orderN++, r = Math.random();
    if (n === 0) return 'chai';
    if (n === 1) return 'roti';
    if (S.stations[2].locked) return r < 0.52 ? 'chai' : 'roti';
    return r < 0.36 ? 'chai' : r < 0.68 ? 'roti' : 'dal';
  }
  function waitSpot(c) {
    var used = {};
    S.customers.forEach(function (o) { if (o !== c && o.st === 'waitgate') used[o.spot] = 1; });
    for (var i = 0; i < WAIT_SPOTS.length; i++) if (!used[i]) { c.spot = i; return WAIT_SPOTS[i]; }
    c.spot = -1; return { x: 180 + rnd(-40, 40), y: 210 + rnd(0, 20) };
  }
  function seekSeat(c) {
    var fs = S.seats.filter(function (s) { return !s.occ && !s.t.locked; });
    if (!fs.length) {
      if (c.st !== 'waitgate') { c.st = 'waitgate'; c.wait = CFG.gateWait; c.path = [waitSpot(c)]; }
      return;
    }
    var s = pick(fs), ax = s.x + s.side * 18;
    s.occ = c; c.seat = s; c.spot = -1; c.st = 'toseat';
    c.path = [{ x: ax, y: 262 }, { x: ax, y: s.y }, { x: s.x, y: s.y }];
  }
  function sit(c) {
    var s = c.seat;
    c.st = 'seated'; c.x = s.x; c.y = s.y; c.order = pickOrder(); c.pat = c.patMax = CFG.patience; c.sat = T;
    c.up = s.y < s.t.cy; c.bx = s.x + s.side * 4; c.by = c.up ? s.y - 36 : s.y + 26;
    sfx('order');
  }
  function leave(c, angry) {
    var s = c.seat;
    c.path = [];
    if (s) { s.occ = null; var ax = s.x + s.side * 18; c.path.push({ x: ax, y: s.y }, { x: ax, y: 262 }); }
    c.path.push({ x: 180 + rnd(-8, 8), y: 194 }, { x: 180, y: 150 }, { x: 180 + rnd(-80, 80), y: 142 });
    c.seat = null; c.st = 'leaving'; c.angry = !!angry;
  }

  function updCustomers(dt) {

  function moveTo(e, tx, ty, dt, sp) {
    var dx = tx - e.x, dy = ty - e.y, d = Math.sqrt(dx * dx + dy * dy);

  // ---------------- serving / cash / pads ----------------
  function takeFromPile(st, who) {

  function serve(c, who) {

    if (isB && CFG.mateServe) { var m = mateOf(c.seat); if (m && m.occ && m.occ.st === 'seated' && hasItem(who, m.occ.order)) serve(m.occ, who); }

  function collectCash(tb) {

  }
  function unlock(p) {

    if (p.id === 'table2') { S.tables[1].locked = false; S.tables[1].born = T; msg = 'Table 2 open — 4 more seats!'; }
    else if (p.id === 'dal') { var st = S.stations[2]; st.locked = false; st.born = T; st.pop = T; st.count = 1; msg = 'Dal unlocked — dal pays ₹45!'; }
    else if (p.id === 'chotu') { S.chotu = { x: p.x, y: p.y + 14, home: { x: p.x, y: p.y + 14 }, stack: [], plan: [], walk: 0, moving: false, squash: 0, born: T, think: 0.6, idle: 0, pause: 0 }; msg = 'Chotu hired! He carries food to guests'; }
    S.shake = 7; sfx('buy'); buzz(30);

  // ---------------- Bhaiya (player) ----------------
  function custTarget(c) { return { k: 'cust', key: 'c' + c.id, ref: c, x: c.seat.x + c.seat.side * 18, y: c.seat.y }; }
  function valid(q) {
    if (q.k === 'cust') return q.ref.st === 'seated';
    if (q.k === 'cash') return q.ref.cash > 0;
    if (q.k === 'buy') return !q.ref.done;
    if (q.k === 'pile') return !q.ref.locked;
    return true;
  }
  function hitTest(x, y) {
    var i, best = null, bd = 1e9;
    for (i = 0; i < S.customers.length; i++) {
      var c = S.customers[i]; if (c.st !== 'seated') continue;
      var d = Math.min(dist(x, y, c.x, c.y - 10), dist(x, y, c.bx, c.by) - 3);
      if (d < 21 && d < bd) { bd = d; best = c; }
    }
    if (best) return custTarget(best);
    for (i = 0; i < S.tables.length; i++) {
      var tb = S.tables[i];
      if (!tb.locked && tb.cash > 0 && Math.abs(x - tb.cx) < 30 && y > tb.cy - 32 && y < tb.cy + 52) return { k: 'cash', key: 't' + tb.i, ref: tb, x: tb.cx, y: tb.cy + 40 };
    }
    for (i = 0; i < S.pads.length; i++) {
      var p = S.pads[i];
      if (!p.done && Math.abs(x - p.x) < p.w / 2 + 6 && Math.abs(y - p.y) < p.h / 2 + 6) return { k: 'buy', key: 'p' + p.id, ref: p, x: p.x, y: p.id === 'dal' ? 500 : p.y };
    }
    for (i = 0; i < S.stations.length; i++) {
      var st = S.stations[i];
      if (Math.abs(x - st.x) < 50 && y > 494 && y < 606) {
        if (st.locked) { var dp = padById('dal'); return { k: 'buy', key: 'pdal', ref: dp, x: dp.x, y: 500 }; }
        return { k: 'pile', key: 's' + st.id, ref: st, x: st.px, y: st.py };
      }
    }
    return null;
  }
  function putBack() {
    // escape hatch for food nobody ordered: only the SURPLUS (items no seated guest is waiting for) flies back
    var b = S.bh, want = {}, keep = [], n = 0;
    S.customers.forEach(function (c) { if (c.st === 'seated') want[c.order] = (want[c.order] || 0) + 1; });
    b.stack.forEach(function (it, i) {
      if (want[it.type] > 0) { want[it.type]--; it.dy -= (i - keep.length) * SP; keep.push(it); return; }
      var st = stationOf(it.type), hy = b.y - 52 - i * SP;
      if (!st.locked && st.count < CFG.pileCap) { addFlyer({ kind: 'item', type: it.type, sx: b.x, sy: hy, tx: pileX(st, st.count), ty: pileY(st, st.count), dur: 0.32, arc: 30, delay: n * 0.03 }); st.count++; }
      else burst(b.x, hy, 3, ['#ffffff']);
      n++;
    });
    if (!n) return false;
    b.stack.length = 0; Array.prototype.push.apply(b.stack, keep);
    b.squash = 1; b.park = null;
    if (b.act && b.act.k === 'grab') done(); // don't re-grab what was just put back
    floatText(b.x, b.y - 64 - keep.length * SP, 'Put back ' + n + '!', '#ffffff', 14); sfx('grab'); buzz(10);
    return true;
  }
  function nearCustomer(x, y, r) {
    // forgiving second pass: a near-miss next to a waiting guest should not cancel the whole queue
    var best = null, bd = r;
    S.customers.forEach(function (c) {
      if (c.st !== 'seated') return;
      var d = Math.min(dist(x, y, c.x, c.y - 10), dist(x, y, c.bx, c.by));
      if (d < bd) { bd = d; best = c; }
    });
    return best ? custTarget(best) : null;
  }
  function onTap(x, y) {
    S.idleT = 0;
    ripple(x, y);
    var t = hitTest(x, y), q = S.queue, b = S.bh, i;
    // tapping Bhaiya OR the food stack / MAX badge on his head puts surplus food back
    if (!t && b.stack.length && Math.abs(x - b.x) < 22 && y < b.y + 6 && y > b.y - 70 - b.stack.length * SP) {
      if (putBack()) return;
      if (b.stack.length >= CFG.cap) { floatText(b.x, b.y - 70 - b.stack.length * SP, 'Guests want all of it — serve!', '#ffe066', 13); sfx('err'); return; }
    }
    if (!t) t = nearCustomer(x, y, 36);
    if (!t) {
      S.queue = [{ k: 'ground', key: 'g', x: clamp(x, 14, 346), y: clamp(y, 182, 505), born: T }];
      b.act = null; sfx('tap'); return;
    }
    t.born = T;
    for (i = 0; i < q.length; i++) if (q[i].key === t.key) break;
    if (i < q.length) {
      // tapping a queued target again (or double-tapping a new one) moves it to the front
      if (i > 0) { var m = q.splice(i, 1)[0]; m.born = T; q.unshift(m); b.act = null; floatText(m.x, m.y - 40, 'First!', '#ffffff', 13); }
      else q[0].born = T;
      sfx('tap'); buzz(8); return;
    }
    if (q.length && q[0].k === 'ground') { q.length = 0; b.act = null; }
    if (q.length >= CFG.queueMax) q[q.length - 1] = t; else q.push(t);
    if (q.length >= 2 && !S.tips.front) { S.tips.front = 1; setMsg('Double-tap a target to make it #1', 3.5); }
    sfx('tap'); buzz(6);
  }
  function done() { S.queue.shift(); S.bh.act = null; }
  function settle(e, dt) { for (var i = 0; i < e.stack.length; i++) e.stack[i].dy *= Math.max(0, 1 - dt * 14); }
  function arrive(g) {
    var b = S.bh;
    b.squash = 1;
    if (g.k === 'pile') { b.act = { k: 'grab', st: g.ref, t: 0, tick: 0, got: 0 }; return; }
    if (g.k === 'buy') { b.act = { k: 'pay', p: g.ref, t: 0, acc: 0, bill: 0 }; return; }
    if (g.k === 'cust') {
      var c = g.ref;
      if (c.st === 'seated') {
        if (hasItem(b, c.order)) serve(c, b);
        else { floatText(c.bx, c.by - 22, 'Need ' + ITEM[c.order].word + '!', '#ff5a3c', 14); c.shakeT = T; sfx('err'); buzz(15); }
      }
    } else if (g.k === 'cash') collectCash(g.ref);
    done();
  }
  function doAct(a, dt) {
    var b = S.bh;
    a.t += dt;
    if (a.k === 'grab') {
      var st = a.st;
      if (b.stack.length >= CFG.cap) { if (!a.got) { floatText(b.x, b.y - 70 - b.stack.length * SP, 'Stack full!', '#ff5a3c', 14); sfx('err'); setMsg('Stack full — serve guests, or tap Bhaiya to put food back', 3); } done(); return; }
      if (st.count <= 0) {

      if (S.wallet <= 0) { floatText(p.x, p.y - p.h / 2 - 12, 'Need ₹' + need + ' more', '#ff5a3c', 15); sfx('err'); buzz(20); done(); return; }
      a.acc += p.price / CFG.payTime * dt;
      var n = Math.min(Math.floor(a.acc), S.wallet, need);
      if (n > 0) { a.acc -= n; S.wallet -= n; p.paid += n; }
      a.bill -= dt;
      if (a.bill <= 0) { a.bill = 0.06; addFlyer({ kind: 'bill', sx: 24, sy: 22, tx: p.x + rnd(-12, 12), ty: p.y + rnd(-6, 6), dur: 0.35, arc: 40 }); sfx('bill'); }
      if (p.paid >= p.price) { unlock(p); done(); }
    }
  }
  function passBy() {
    var b = S.bh, i;
    if (b.stack.length) for (i = 0; i < S.customers.length; i++) {
      var c = S.customers[i];
      if (c.st === 'seated' && hasItem(b, c.order) && dist(b.x, b.y, c.x, c.y) < CFG.passR) serve(c, b);
    }
    for (i = 0; i < S.tables.length; i++) { var tb = S.tables[i]; if (tb.cash > 0 && dist(b.x, b.y, tb.cx, tb.cy + 40) < CFG.cashR) collectCash(tb); }
  }
  function updBh(dt) {
    var b = S.bh, q = S.queue, i;
    b.moving = false; b.squash = Math.max(0, b.squash - dt * 5); settle(b, dt);
    for (i = q.length - 1; i >= 0; i--) if (!valid(q[i])) { q.splice(i, 1); if (i === 0) b.act = null; }
    if (q.length) {
      S.idleT = 0;
      if (!b.act) {
        b.park = null;
        if (moveTo(b, q[0].x, q[0].y, dt, CFG.speed)) arrive(q[0]);
        else if (Math.random() < dt * 12) dust(b.x, b.y);
      }
      if (b.act) doAct(b.act, dt);
    } else if (!b.act) S.idleT += dt;
    passBy();
  }

  // ---------------- Chotu (helper) ----------------
  function planChotu(h) {
    var queued = {};
    S.queue.forEach(function (q) { if (q.k === 'cust') queued[q.ref.id] = 1; });
    // most urgent first, but prefer orders Bhaiya is NOT already carrying (Chotu covers the gaps)
    var cands = S.customers.filter(function (c) { return c.st === 'seated' && !queued[c.id]; }).sort(function (a, z) {
      return (hasItem(S.bh, a.order) ? 100 : 0) + a.pat - (hasItem(S.bh, z.order) ? 100 : 0) - z.pat;
    });
    if (!cands.length) return;
    var carried = h.stack.map(function (it) { return it.type; }), picks = [], need = {}, i, c, k;
    for (i = 0; i < cands.length && picks.length < CFG.chotuCap; i++) { c = cands[i]; k = carried.indexOf(c.order); if (k >= 0) { carried.splice(k, 1); picks.push(c); } }
    var room = CFG.chotuCap - h.stack.length;
    for (i = 0; i < cands.length && picks.length < CFG.chotuCap && room > 0; i++) { c = cands[i]; if (picks.indexOf(c) < 0) { picks.push(c); need[c.order] = (need[c.order] || 0) + 1; room--; } }
    if (!picks.length) return;
    Object.keys(need).forEach(function (t) { var st = stationOf(t); h.plan.push({ k: 'pile', st: st, n: need[t], x: st.px + 16, y: st.py - 2, tick: 0, wait: 0 }); });
    picks.forEach(function (o) { h.plan.push({ k: 'cust', c: o, x: o.seat.x + o.seat.side * 18, y: o.seat.y + 6 }); });
    h.idle = 0;
  }
  function updChotu(h, dt) {
    h.moving = false; h.squash = Math.max(0, h.squash - dt * 5); settle(h, dt);
    if (h.pause > 0) { h.pause -= dt; return; }
    if (!h.plan.length) {
      h.think -= dt;
      if (h.think <= 0) { h.think = 0.25; planChotu(h); }
      if (!h.plan.length) {
        if (h.stack.length) { h.idle += dt; if (h.idle > 5) { burst(h.x, h.y - 40, 6, ['#ffffff']); h.stack.length = 0; h.idle = 0; } }
        moveTo(h, h.home.x, h.home.y, dt, CFG.chotuSpeed * 0.8);
        return;
      }
    }
    var s = h.plan[0];
    if ((s.k === 'cust' && s.c.st !== 'seated') || (s.k === 'pile' && (s.n <= 0 || h.stack.length >= CFG.chotuCap))) { h.plan.shift(); return; }
    if (!moveTo(h, s.x, s.y, dt, CFG.chotuSpeed)) return;
    if (s.k === 'pile') {
      s.tick -= dt; s.wait += dt;
      if (s.st.count > 0 && s.tick <= 0) { s.tick = 0.15; if (takeFromPile(s.st, h)) s.n--; }
      if (s.wait > 3.5) h.plan.shift();
    } else {
      if (hasItem(h, s.c.order) && serve(s.c, h)) h.pause = CFG.chotuPause;
      h.plan.shift();
    }
  }

  // ---------------- stations ----------------
  function updStations(dt) {
    var b = S.bh;
    S.stations.forEach(function (st) {
      if (st.locked) return;
      if (st.id !== 'roti' && Math.random() < dt * 2.2) steam(st.x + (st.id === 'chai' ? 22 : rnd(-12, 12)), st.id === 'chai' ? 562 : 568);
      if (st.id === 'roti' && Math.random() < dt * 3) part({ x: st.x + rnd(-8, 8), y: 570, vx: rnd(-10, 10), vy: rnd(-40, -20), g: 0, life: 0.6, max: 0.6, col: pick(['#ffb347', '#ff7a1a', '#ffe08a']), sz: rnd(1, 2), kind: 'dust' });
      if (st.count >= CFG.pileCap) { st.t = 0; return; }

        if (b.park === st && !S.queue.length && !b.act && b.stack.length < CFG.cap - 2 && dist(b.x, b.y, st.px, st.py) < 16) takeFromPile(st, b);
        else if (st.count === 1) sfx('cook');

    });
  }

  // ---------------- guidance ----------------
  function cashTable() { var best = null; S.tables.forEach(function (tb) { if (tb.cash > 0 && (!best || tb.cash > best.cash)) best = tb; }); return best; }
  function queued(key) { for (var i = 0; i < S.queue.length; i++) if (S.queue[i].key === key) return true; return false; }
  function nextAction() {
    var b = S.bh, i, c, st, tb, p;
    if (S.guideForce > 0 && S.forcePad && !S.forcePad.done && !queued('p' + S.forcePad.id)) {
      p = S.forcePad; return { x: p.x, y: p.y, txt: p.label + ' ready! Tap it — Bhaiya pays ₹' + (p.price - p.paid) };
    }
    tb = cashTable();
    if (S.timeLeft < 15 && tb && !queued('t' + tb.i)) return { x: tb.cx, y: tb.cy, txt: 'Hurry! Collect the ₹ before the shift ends' };
    var wait = S.customers.filter(function (o) { return o.st === 'seated'; }).sort(function (a, z) { return a.pat - z.pat; });
    for (i = 0; i < wait.length; i++) { c = wait[i]; if (hasItem(b, c.order) && !queued('c' + c.id)) return { x: c.bx, y: c.by, txt: 'Tap the customer — serve the ' + ITEM[c.order].word + '!' }; }
    if (b.stack.length < CFG.cap) {

    } else if (wait.length && !wait.some(function (o) { return hasItem(b, o.order); })) return { follow: true, x: b.x, y: 0, txt: 'Nobody ordered that! Tap Bhaiya to put it back' };
    if (tb && !queued('t' + tb.i)) return { x: tb.cx, y: tb.cy, txt: 'Tap the ₹ on the table to collect cash' };
    for (i = 0; i < S.pads.length; i++) { p = S.pads[i]; if (!p.done && S.wallet >= p.price - p.paid && !queued('p' + p.id)) return { x: p.x, y: p.y, txt: 'Tap "' + p.label + '" to buy it' }; }
    if (b.stack.length < 2 && !queued('schai')) { st = S.stations[0]; return { x: st.x, y: 528, txt: 'Tap CHAI — Bhaiya runs over & grabs cups' }; }
    return null;
  }

  function drawChotu(h) {

    c.restore();
    drawStack(h, h.y - bob - 42, 0);
    if (h !== GHOST_CHOTU && T - h.born < 4) label(c, 'Chotu', h.x, h.y - 52 - h.stack.length * SP, 11, '#fff', { sw: 3 });
  }
  function drawCust(o) {
    var c = ctx, seated = o.st === 'seated' || o.st === 'eating', s = popS(o.born, 0.3);
    var bob = o.moving ? Math.abs(Math.sin(o.walk)) * 2 : o.st === 'eating' ? Math.abs(Math.sin(T * 12)) : 0;

    circ(c, -2.2, -25 + y, 0.9, '#1a1a1a'); circ(c, 2.2, -25 + y, 0.9, '#1a1a1a');

  function drawBubble(o) {
    var c = ctx, f = clamp(o.pat / o.patMax, 0, 1), s = popS(o.sat, 0.35), d = o.up ? 1 : -1;

    circ(c, 0, 0, 13, '#fff');

    c.beginPath(); c.arc(0, 0, 15.5, -Math.PI / 2, -Math.PI / 2 + TAU * f); c.strokeStyle = f > 0.55 ? '#2bb673' : f > 0.28 ? '#ffb020' : '#ff3b30'; c.lineCap = 'round'; c.stroke();
    drawItem(c, o.order, 0, 1, 1.15);

  }
  function drawWaitBubble(o) {
    var c = ctx, f = clamp(o.wait / CFG.gateWait, 0, 1), x = o.x, y = o.y - 42;
    circ(c, x, y, 9, 'rgba(255,255,255,.92)');
    c.beginPath(); c.arc(x, y, 11, -Math.PI / 2, -Math.PI / 2 + TAU * f); c.strokeStyle = f > 0.4 ? '#ffb020' : '#ff3b30'; c.lineWidth = 2.5; c.stroke();
    for (var i = 0; i < 3; i++) circ(c, x - 4 + i * 4, y, 1.4, 'rgba(60,40,20,' + (0.3 + 0.7 * Math.max(0, Math.sin(T * 6 - i))) + ')');
  }

  // ---------------- rendering: overlays / fx / hud ----------------
  function drawPath() {
    var q = S.queue, c = ctx; if (!q.length) return;
    c.save(); c.setLineDash([2, 7]); c.lineDashOffset = -T * 30; c.lineCap = 'round'; c.lineWidth = 3; c.strokeStyle = 'rgba(255,255,255,.8)';
    c.beginPath(); c.moveTo(S.bh.x, S.bh.y); q.forEach(function (m) { c.lineTo(m.x, m.y); }); c.stroke(); c.restore();
  }
  function drawMarkers() {
    var q = S.queue, c = ctx;
    for (var i = q.length - 1; i >= 0; i--) {
      var m = q[i], s = popS(m.born, 0.3), col = i === 0 ? '#ff4f2e' : '#ff9f1c';
      c.save(); c.translate(m.x, m.y);
      c.save(); c.scale(s, s); c.beginPath(); c.ellipse(0, 0, 13, 5.5, 0, 0, TAU); c.strokeStyle = col; c.lineWidth = 2.5; c.stroke(); c.restore();
      if (m.k !== 'ground') {
        c.translate(0, -18 - (i === 0 ? Math.abs(Math.sin(T * 6)) * 3 : 0)); c.scale(s, s);
        c.beginPath(); c.moveTo(-5, 6); c.lineTo(5, 6); c.lineTo(0, 13); c.closePath(); c.fillStyle = col; c.fill();
        circ(c, 0, 0, 10, '#fff'); circ(c, 0, 0, 8, col); label(c, String(i + 1), 0, 0.5, 12, '#fff');
      }
      c.restore();
    }
  }
  function drawFx() {
    var c = ctx;
    S.ripples.forEach(function (r) {
      var k = (T - r.born) / 0.4;
      c.beginPath(); c.arc(r.x, r.y, 4 + k * 18, 0, TAU); c.strokeStyle = 'rgba(255,255,255,' + (1 - k) * 0.9 + ')'; c.lineWidth = 2.5; c.stroke();
    });
    S.parts.forEach(function (p) {
      c.globalAlpha = clamp(p.life / p.max, 0, 1);
      if (p.kind === 'conf') { c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.fillStyle = p.col; c.fillRect(-p.sz, -p.sz * 0.5, p.sz * 2, p.sz); c.restore(); }
      else circ(c, p.x, p.y, p.sz, p.col);
    });
    c.globalAlpha = 1;
    S.flyers.forEach(function (f) {
      if (f.t < 0) return;
      var e = clamp(f.t / f.dur, 0, 1), tx = f.tx, ty = f.ty;
      if (f.to) { tx = f.to.x; ty = f.to.y - (f.to === S.bh ? 52 : 42) - f.slot * SP; }
      var ee = f.kind === 'coin' ? e * e * 0.6 + e * 0.4 : e;
      var x = lerp(f.sx, tx, ee), y = lerp(f.sy, ty, ee) - f.arc * 4 * e * (1 - e);
      if (f.kind === 'item') drawItem(c, f.type, x, y, 1);
      else if (f.kind === 'coin') { c.save(); c.translate(x, y); c.scale(Math.abs(Math.cos(T * 10 + f.sx)) * 0.7 + 0.3, 1); coin(c, 0, 0, 6.5); c.restore(); }
      else { c.save(); c.translate(x, y); c.rotate(e * 6); frr(c, -6, -3.5, 12, 7, 1.5, '#3f9e4f'); frr(c, -3.5, -1.5, 7, 3, 1, '#a5d6a7'); c.restore(); }
    });
    S.texts.forEach(function (t) {
      var age = T - t.born, a = age > t.max * 0.65 ? 1 - (age - t.max * 0.65) / (t.max * 0.35) : 1;
      c.save(); c.globalAlpha = clamp(a, 0, 1); c.translate(t.x, t.y - age * 26); var s = backOut(age / 0.25); c.scale(s, s);
      label(c, t.s, 0, 0, t.size, t.col, { sw: 3.5 }); c.restore();
    });
  }
  function drawGuide() {
    var g = S.guide, c = ctx; if (!g) return;
    var b = Math.abs(Math.sin(T * 5)) * 7, pr = (T * 1.5) % 1;
    c.beginPath(); c.arc(g.x, g.y, 10 + pr * 16, 0, TAU); c.strokeStyle = 'rgba(255,225,70,' + (1 - pr) * 0.9 + ')'; c.lineWidth = 3; c.stroke();
    c.save(); c.translate(g.x, g.y - 20 - b);
    c.beginPath(); c.moveTo(-7, -24); c.lineTo(7, -24); c.lineTo(7, -11); c.lineTo(14, -11); c.lineTo(0, 3); c.lineTo(-14, -11); c.lineTo(-7, -11); c.closePath();
    c.lineJoin = 'round'; c.lineWidth = 4; c.strokeStyle = '#6b2f00'; c.stroke(); c.fillStyle = '#ffd23f'; c.fill();
    c.restore();
  }
  function button(x, y, w, h, txt) {
    var c = ctx, p = 1 + Math.sin(T * 4) * 0.025;

  }
  function drawHUD() {
    var c = ctx;
    var wp = 1 + Math.max(0, 1 - (T - S.walletPop) / 0.25) * 0.2;
    frr(c, 8, 7, 106, 30, 15, 'rgba(58,28,8,.85)');

    label(c, '₹' + S.earned, 344, 16, 11, '#ffd23f', { a: 'right' });
    frr(c, 244, 25, 100, 7, 3.5, 'rgba(255,255,255,.18)');
    var f = clamp(S.earned / CFG.stars[2], 0, 1);
    if (f > 0) frr(c, 244, 25, Math.max(7, 100 * f), 7, 3.5, '#ffc531');
    for (var i = 0; i < 3; i++) star(c, 244 + 100 * CFG.stars[i] / CFG.stars[2], 28.5, 6, S.earned >= CFG.stars[i] ? '#ffd23f' : '#8a6a4a', '#3a1c08');
    if (S.mode === 'play') {
      var m = S.msgT > 0, t = m ? S.msg : S.hint;
      if (t) { frr(c, 10, 607, 340, 27, 13.5, m ? 'rgba(120,40,0,.9)' : 'rgba(40,20,5,.78)'); label(c, t, 180, 621, 13, m ? '#ffe066' : '#fff4dc', { w: 600, max: 324 }); }
    }
  }
  var DEMO = { x: 96, y: 352, stack: [{ type: 'chai', land: -1, dy: 0 }, { type: 'roti', land: -1, dy: 0 }, { type: 'chai', land: -1, dy: 0 }], moving: false, walk: 0, squash: 0 };
  function drawStart() {
    var c = ctx, s = popS(S.bornT, 0.5);
    c.fillStyle = 'rgba(45,20,5,.55)'; c.fillRect(0, 0, W, H);
    c.save(); c.translate(180, 320); c.scale(s, s); c.translate(-180, -320);
    frr(c, 24, 130, 312, 380, 24, '#7a3b10'); frr(c, 24, 124, 312, 380, 24, '#fff3df');

    c.beginPath(); c.moveTo(DEMO.x, DEMO.y); pts.forEach(function (p) { c.lineTo(p.x, p.y); }); c.stroke(); c.restore();
    drawItem(c, 'chai', 170, 280, 1.4); drawItem(c, 'roti', 236, 318, 1.4); coin(c, 292, 276, 9);
    pts.forEach(function (p, i) { circ(c, p.x, p.y, 10, '#fff'); circ(c, p.x, p.y, 8, i ? '#ff9f1c' : '#ff4f2e'); label(c, String(i + 1), p.x, p.y + 0.5, 12, '#fff'); });
    drawBhaiya(DEMO);
    label(c, 'Tap a counter, a customer or the ₹ cash —', 180, 386, 14, '#5a3418', { w: 600 });
    label(c, 'Bhaiya runs there and does it. Queue up to 3!', 180, 406, 14, '#5a3418', { w: 600 });
    label(c, 'Earn ₹' + CFG.goal + ' in 2 minutes', 180, 430, 15, '#c0392b');
    button(70, 446, 220, 50, 'Start shift');
    c.restore();
    S.btn = { x: 70, y: 446, w: 220, h: 50 };
  }
  function drawEnd() {
    var c = ctx, s = backOut(S.endT / 0.45);
    c.fillStyle = 'rgba(45,20,5,' + 0.6 * clamp(S.endT / 0.3, 0, 1) + ')'; c.fillRect(0, 0, W, H);
    c.save(); c.translate(180, 320); c.scale(s, s); c.translate(-180, -320);

    }

    label(c, '₹' + S.earned + ' earned', 180, 284, 28, '#3d1f08');
    label(c, ok ? 'Goal ₹' + CFG.goal + ' reached — shabash!' : 'Goal: earn ₹' + CFG.goal + ' — try again!', 180, 312, 14, ok ? '#1e8a55' : '#b04a1a', { w: 600 });
    label(c, 'Served ' + S.served + '   ·   Lost ' + S.lost, 180, 346, 16, '#5a3418');
    label(c, S.bestCombo >= 2 ? 'Best combo  x' + S.bestCombo : 'No combos — serve back-to-back!', 180, 372, 14, '#5a3418', { w: 600 });
    if (S.leftCash > 0) label(c, '₹' + S.leftCash + ' left uncollected on tables', 180, 396, 12.5, '#a0703c', { w: 600 });
    if (S.endT > 1.0) button(70, 426, 220, 52, 'Play again');
    c.restore();
    S.btn = { x: 70, y: 426, w: 220, h: 52 };
  }
  function render() {
    var c = ctx;
    c.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
    c.fillStyle = '#e9a55a'; c.fillRect(0, 0, W, H);
    c.save();
    if (S.shake > 0) c.translate(rnd(-1, 1) * S.shake, rnd(-1, 1) * S.shake);
    c.drawImage(bgc, 0, 0, W, H);
    S.vehicles.forEach(drawVeh);
    S.tables.forEach(drawTableSet);
    S.stations.forEach(drawStation);
    S.pads.forEach(function (p) { if (!p.done) drawPad(p); });
    drawPath();
    var ents = S.customers.slice(); ents.push(S.bh); if (S.chotu) ents.push(S.chotu);
    ents.sort(function (a, b) { return a.y - b.y; });
    ents.forEach(function (e) { if (e === S.bh) drawBhaiya(e); else if (e === S.chotu) drawChotu(e); else drawCust(e); });
    if (!S.tables[0].locked) drawCanopy(S.tables[0], '#1fa39a', '#ffd23f');
    if (!S.tables[1].locked) drawCanopy(S.tables[1], '#e0457b', '#ff9f1c');
    S.customers.forEach(function (o) { if (o.st === 'seated') drawBubble(o); else if (o.st === 'waitgate') drawWaitBubble(o); });
    drawMarkers();
    drawFx();
    if (S.mode === 'play') drawGuide();
    c.restore();
    drawHUD();
    if (S.mode === 'start') drawStart(); else if (S.mode === 'end') drawEnd();
  }

  // ---------------- boot / input / loop ----------------
  function startShift() {
    initAudio();
    S = newState(); S.mode = 'play'; window.__dhaba.state = S;
    sfx('start'); buzz(15);
  }
  function resize() {
    var vw = window.innerWidth || W, vh = window.innerHeight || H, k = Math.min(vw / W, vh / H);
    var dpr = Math.min(window.devicePixelRatio || 1, 3), cw = Math.floor(W * k), ch = Math.floor(H * k);
    cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
    cv.width = Math.max(1, Math.round(cw * dpr)); cv.height = Math.max(1, Math.round(ch * dpr));
    bgc.width = cv.width; bgc.height = cv.height;
    drawBg();
  }
  cv.addEventListener('pointerdown', function (e) {
    e.preventDefault(); initAudio();
    if (e.pointerType === 'mouse' && e.button !== 0) return; // right/middle click is not a tap
    var r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
    if (S.mode === 'play') {
      // re-tapping (or double-tapping) a queued target moves it to the front - see onTap
      onTap(x, y); return;
    }
    if (S.mode === 'start') { startShift(); return; } // any tap on the start card starts the shift
    if (S.mode === 'end' && S.endT < 1.0) return;
    var b = S.btn;
    if (b && x > b.x - 10 && x < b.x + b.w + 10 && y > b.y - 12 && y < b.y + b.h + 12) startShift();
  }, { passive: false });
  window.addEventListener('pointerup', initAudio);
  window.addEventListener('touchend', initAudio, { passive: true }); // iOS grants audio on touchend
  window.addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && S.mode !== 'play' && !(S.mode === 'end' && S.endT < 1)) { e.preventDefault(); startShift(); }
  });
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); }); // iOS pinch-zoom
  cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('visibilitychange', function () {
    paused = document.hidden;
    try { if (AC) quiet(paused ? AC.suspend() : AC.resume()); } catch (e) { /* ignore */ }
  });
  window.addEventListener('resize', resize);
  function frame(now) {
    requestAnimationFrame(frame);
    if (!last) last = now;
    var dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
    if (paused) return;
    T += dt;
    update(dt);
    render();
  }
  S = newState();
  // debug hooks: __dhaba.step(sec) advances the sim at 60 fps; __dhaba.tap(x, y) taps in logical 360x640 coords
  window.__dhaba = {
    state: S, cfg: CFG, start: startShift,
    step: function (sec) { for (var i = 0, n = Math.round(sec * 60); i < n; i++) { T += 1 / 60; update(1 / 60); } render(); return S; },
    tap: function (x, y) { if (S.mode === 'play') onTap(x, y); else if (!(S.mode === 'end' && S.endT < 1)) startShift(); }
  };
  resize();
  try {
    if (document.fonts && document.fonts.load) {
      Promise.all([document.fonts.load('800 16px "Baloo 2"'), document.fonts.load('600 16px "Baloo 2"')]).then(drawBg, function () {});
    }
  } catch (e) { /* font optional */ }
  requestAnimationFrame(frame);
})();
